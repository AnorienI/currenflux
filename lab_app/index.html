<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto & Macro Lab Control</title>
    <!-- Emoji 🤖 como favicon direto via SVG inline -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-blue: #00bfff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d3748;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--accent-blue);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid #2d3748;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .card.signal-buy {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-buy {
            background: var(--accent-green);
            color: #000;
        }

        .badge-hold {
            background: #4a5568;
            color: #fff;
        }

        .metric-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .metric-sub {
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }

        button.sync-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Crypto & Macro Lab Hub</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('crypto')">🔥 Crypto Lab</button>
            <button class="tab-btn" onclick="switchTab('macro')">🌐 Global Macro</button>
        </div>
    </header>

    <!-- ABA 1: CRYPTO LAB -->
    <div id="tab-crypto" class="tab-content active">
        <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <p style="color: var(--text-muted); margin: 0;">Carteira de Teste Mercado Pago (R$ 150 - R$ 200)</p>
            <button class="sync-btn" onclick="fetchData()">🔄 Atualizar Dados</button>
        </div>
        <div id="crypto-grid" class="grid-container">
            <!-- Cards gerados via JS -->
        </div>
    </div>

    <!-- ABA 2: GLOBAL MACRO -->
    <div id="tab-macro" class="tab-content">
        <div class="grid-container">
            <div class="card">
                <div class="metric-title">Taxas dos Bancos Centrais</div>
                <div class="metric-sub">BCB (Selic): <strong id="bcb-rate">-</strong></div>
                <div class="metric-sub">Fed (USD): <strong id="fed-rate">-</strong></div>
                <div class="metric-sub">ECB (EUR): <strong id="ecb-rate">-</strong></div>
            </div>
            <div class="card">
                <div class="metric-title">BRL Strength Index</div>
                <div id="brl-status" class="metric-value" style="font-size: 1.3rem; color: var(--accent-blue);">-</div>
                <div class="metric-sub">USD/BRL: <span id="usd-brl">-</span></div>
                <div class="metric-sub">EUR/BRL: <span id="eur-brl">-</span></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tabName === 'crypto') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-crypto').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-macro').classList.add('active');
            }
        }

        // Sintetizador de áudio arcade via Web Audio API
        function playArcadeSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Áudio bloqueado pelo navegador.");
            }
        }

        async function fetchData() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/dashboard-data');
                const data = await res.json();
                
                // 1. Atualizar Crypto Lab
                const cryptoGrid = document.getElementById('crypto-grid');
                cryptoGrid.innerHTML = '';
                
                let hasBuySignal = false;

                data.crypto.forEach(coin => {
                    const isBuy = coin.signal === 'BUY';
                    if (isBuy) hasBuySignal = true;

                    const card = document.createElement('div');
                    card.className = `card ${isBuy ? 'signal-buy' : ''}`;
                    card.innerHTML = `
                        <span class="badge ${isBuy ? 'badge-buy' : 'badge-hold'}">${coin.signal}</span>
                        <div class="metric-title">${coin.ticker} / BRL</div>
                        <div class="metric-value">R$ ${coin.price_brl.toLocaleString('pt-BR')}</div>
                        <div class="metric-sub ${coin.pct_from_high < 0 ? 'text-red' : 'text-green'}">
                            ${coin.pct_from_high}% (24h)
                        </div>
                    `;
                    cryptoGrid.appendChild(card);
                });

                if (hasBuySignal) {
                    playArcadeSound();
                }

                // 2. Atualizar Global Macro
                document.getElementById('bcb-rate').innerText = `${data.macro.bcb_rate}%`;
                document.getElementById('fed-rate').innerText = `${data.macro.fed_rate}%`;
                document.getElementById('ecb-rate').innerText = `${data.macro.ecb_rate}%`;
                document.getElementById('brl-status').innerText = data.macro.brl_strength_index;
                document.getElementById('usd-brl').innerText = `R$ ${data.macro.usd_brl}`;
                document.getElementById('eur-brl').innerText = `R$ ${data.macro.eur_brl}`;

            } catch (err) {
                console.error("Erro ao procurar dados:", err);
            }
        }

        // Carrega os dados ao abrir a página
        fetchData();
        // Atualiza automaticamente a cada 30 segundos
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
