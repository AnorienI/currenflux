name: Update CurrenFlux Data Daily

on:
  schedule:
    # Runs at 21:00 UTC (18:00 BRT / Market Close) Monday to Friday
    - cron: '0 21 * * 1-5'
  # Allows manual runs from the GitHub website Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull repository files into the runner
      - name: Check out repo
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the full modular pipeline (FX, central banks, trade balance)
      - name: Run data pipeline
        run: python main.py
      - name: Show generated files
        run: |
            pwd
            ls -la
            find . -name "*.csv"

       # 5. Push updated CSVs to the private data repo
      - name: Push data to private repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${TOKEN}@github.com/AnorienI/currenflux.git data-repo
          cp modules/fx_dashboard.csv modules/cb_rates.csv modules/trade_data.csv data-repo/
          cd data-repo
          git add .
          git commit -m "Auto-update pipeline data [skip ci]" || exit 0
          git push
